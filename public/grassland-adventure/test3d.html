<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D诊断测试</title>
    <script type="importmap">
    {
        "imports": {
            "three": "https://esm.sh/three@0.160.0",
            "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <style>
        body { margin: 0; font-family: sans-serif; background: #222; color: #0f0; padding: 20px; }
        #log { white-space: pre-wrap; font-family: monospace; line-height: 1.6; }
        canvas { display: block; margin: 20px 0; border: 2px solid #0f0; }
    </style>
</head>
<body>
    <div id="log">开始诊断...</div>
    <canvas id="c"></canvas>

    <script type="module">
        const log = (msg) => {
            document.getElementById('log').textContent += '\n' + msg;
            console.log(msg);
        };

        try {
            log('1. 正在导入 three.js...');
            const THREE = await import('three');
            log('2. three.js 导入成功: ' + THREE.REVISION);

            log('3. 正在导入 GLTFLoader...');
            const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
            log('4. GLTFLoader 导入成功');

            const canvas = document.getElementById('c');
            canvas.width = 400; canvas.height = 300;

            log('5. 创建 WebGL 渲染器...');
            const renderer = new THREE.WebGLRenderer({ canvas });
            renderer.setSize(400, 300);
            log('6. WebGL 渲染器创建成功');

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x446688);
            const camera = new THREE.PerspectiveCamera(45, 4/3, 0.1, 100);
            camera.position.set(0, 1, 3);

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            scene.add(new THREE.DirectionalLight(0xffffff, 0.5));

            // 先放一个简单立方体确保渲染管道正常
            const geo = new THREE.BoxGeometry(1,1,1);
            const mat = new THREE.MeshStandardMaterial({ color: 0xff6600 });
            const cube = new THREE.Mesh(geo, mat);
            cube.position.y = 0.5;
            scene.add(cube);
            renderer.render(scene, camera);
            log('7. 基础立方体渲染成功');

            log('8. 开始加载 GLB 模型 (约53MB，请耐心等待)...');
            const loader = new GLTFLoader();
            const startTime = Date.now();

            loader.load('images/lulu3d.glb',
                (gltf) => {
                    const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
                    log('9. 模型加载成功! 耗时 ' + elapsed + ' 秒');
                    const model = gltf.scene;

                    const box = new THREE.Box3().setFromObject(model);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    log('10. 模型尺寸: ' + size.x.toFixed(2) + ' x ' + size.y.toFixed(2) + ' x ' + size.z.toFixed(2));
                    log('11. 模型中心: ' + center.x.toFixed(2) + ', ' + center.y.toFixed(2) + ', ' + center.z.toFixed(2));

                    scene.remove(cube);
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const scale = 2 / maxDim;
                    model.scale.set(scale, scale, scale);
                    model.position.set(-0.4, -center.y * scale + 0.2, 0);
                    scene.add(model);
                    renderer.render(scene, camera);
                    log('12. 模型已渲染到画布上');
                },
                (progress) => {
                    if (progress.total > 0) {
                        const pct = Math.round((progress.loaded / progress.total) * 100);
                        log('   加载进度: ' + pct + '% (' + (progress.loaded/1024/1024).toFixed(1) + ' / ' + (progress.total/1024/1024).toFixed(1) + ' MB)');
                    }
                },
                (err) => {
                    log('ERROR: 模型加载失败');
                    log(err.toString());
                }
            );
        } catch (e) {
            log('ERROR: ' + e.toString());
        }
    </script>
</body>
</html>
